[project]
name = "omron-connect-mcp"
version = "0.1.0"
description = "MCP server for OMRON connect health data (blood pressure, weight)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-2.0-only" }
authors = [{ name = "Aircon Chen" }]
keywords = ["mcp", "omron", "blood-pressure", "health"]
dependencies = [
    "mcp>=1.2.0",
    "omramin @ git+https://github.com/bugficks/omramin.git",
]

[project.scripts]
omron-connect-mcp = "omron_connect_mcp.server:main"

[project.urls]
Homepage = "https://github.com/aircon-chen/omron-connect-mcp"
Issues = "https://github.com/aircon-chen/omron-connect-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omron_connect_mcp"]

[tool.hatch.metadata]
allow-direct-references = true
